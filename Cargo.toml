[package]
name = "code-trail"
version = "0.6.0"
edition = "2024"
license = "MIT"
description = "Local, evidence-backed code tours and static change reach"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"
tar = "0.4"
fs2 = "0.4"
tiktoken-rs = "0.12"
tree-sitter = "0.27"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"

[profile.release]
lto = "thin"
strip = true

